# Satu-satunya daftar materi. Dipakai oleh beranda (index.html) dan sidebar halaman materi.
# Urutan di sini = urutan tampil. Untuk materi baru: tambahkan satu blok "- judul: ..." di mapel yang sesuai.
#   url   : alamat halaman (.md diganti .html), diawali garis miring
#   siap  : true jika isi materi sudah ada; false akan tampil "Segera hadir" dan tidak bisa dibuka

